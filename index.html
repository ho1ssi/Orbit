<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#f6f6f6"><link rel="apple-touch-icon" href="./icon-180.png"><link rel="icon" type="image/png" href="./icon-192.png"><link rel="manifest" href="./manifest.json"><title>오르빗</title><link rel="stylesheet" href="./style.css"></head>
<body><header><div class="account-bar"><button id="cloud-account" type="button"><img class="brand-logo" src="./brand-logo.png" alt=""><span>구글 로그인</span></button><span id="cloud-status" role="status" hidden></span></div><div class="date-nav"><button id="previous" aria-label="이전 날짜"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m15 5-7 7 7 7"/></svg></button><button id="date-label"></button><input id="date" type="date" aria-label="날짜 선택"><button id="next" aria-label="다음 날짜"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m9 5 7 7-7 7"/></svg></button></div><div class="header-actions"><button id="today">오늘</button><button id="calendar-open" aria-label="월간 캘린더"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4M17 3v4M3 10h18"/><path d="M7 14h2M11 14h2M15 14h2M7 17h2M11 17h2"/></svg></button></div></header><nav class="view-tabs" aria-label="화면 보기" data-view="both"><button id="view-both" class="selected" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M11 4v16"/></svg>전체</button><button id="view-tasks" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m3 7 2 2 3-4M11 7h10M3 14h5M11 14h10M3 20h5M11 20h10"/></svg>할 일</button></nav>
<main><section class="plan" aria-label="하루 시간표"><div class="plan-title">시간표<button id="add-event" aria-label="일정 추가">＋</button></div><div class="ruler"><div></div><div class="minute-labels"><span>10</span><span>20</span><span>30</span><span>40</span><span>50</span><span>60</span></div></div><div id="timeline"></div></section><section class="study"><div class="tasks-heading"><div class="task-period" aria-label="할 일 보기 기간"><button type="button" id="period-day" aria-pressed="true">일간</button><button type="button" id="period-week" aria-pressed="false">주간</button></div><span>할 일</span><button id="new-group" aria-label="할 일 추가">＋ 추가</button></div><div id="week-overview" hidden><div id="week-days"></div><div id="week-selected-date"></div></div><div class="task-scroll"><div id="groups"></div><button class="add-group" id="group-add">＋ 카테고리 추가</button></div></section>
</main>
<dialog id="editor"><form id="form" novalidate><div class="dialog-head"><h2 id="editor-title">할 일 추가</h2><button type="button" id="cancel" aria-label="닫기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><label>할 일<input id="task" required maxlength="100"></label><fieldset class="category-field"><legend>카테고리</legend><div id="category-picks"></div><input id="category" type="hidden"></fieldset><label class="inline"><input type="checkbox" id="scheduled"> 시간 설정</label><div class="time-fields"><label>시작<input type="hidden" id="start"><button type="button" class="time-display" id="start-display" aria-label="시작시간 선택"><span>시간 선택</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/></svg></button></label><label>종료 (선택)<input type="hidden" id="end"><button type="button" class="time-display" id="end-display" aria-label="종료시간 선택"><span>시간 선택</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/></svg></button></label></div><div id="start-picker"><div class="start-picker-heading"><p class="picker-title">시작시간</p><div id="period-picks" class="picker-row"></div></div><div id="hour-picks" class="picker-row hour-picks"></div><div id="minute-picks" class="picker-row"></div><p id="picker-hint"></p></div><details id="time-tools"><summary class="time-target"><span>종료시간 (선택)</span><span id="duration"></span></summary><div class="time-increments"><button type="button" data-minutes="1">+1분</button><button type="button" data-minutes="5">+5분</button><button type="button" data-minutes="30">+30분</button><button type="button" data-minutes="60">+1시간</button></div><div class="time-increments time-decrements"><button type="button" data-minutes="-1">−1분</button><button type="button" data-minutes="-5">−5분</button><button type="button" data-minutes="-30">−30분</button><button type="button" data-minutes="-60">−1시간</button></div></details><label class="inline"><input type="checkbox" id="repeating"> 반복 설정</label><div id="repeat-tools" hidden><div class="repeat-heading"><span>반복</span><div class="repeat-toggle"><button type="button" id="repeat-daily" aria-pressed="false">매일</button><button type="button" id="repeat-weekly" aria-pressed="false">매주</button><button type="button" id="repeat-monthly" aria-pressed="false">매달</button></div></div><div id="repeat-days" hidden><button type="button" data-day="1" aria-pressed="false">월</button><button type="button" data-day="2" aria-pressed="false">화</button><button type="button" data-day="3" aria-pressed="false">수</button><button type="button" data-day="4" aria-pressed="false">목</button><button type="button" data-day="5" aria-pressed="false">금</button><button type="button" data-day="6" aria-pressed="false">토</button><button type="button" data-day="0" aria-pressed="false">일</button></div><div id="repeat-month-day-row" hidden><span>날짜</span><div>매월 <input id="repeat-month-day" type="hidden" value="1"><button id="repeat-month-day-button" type="button" aria-label="매월 반복 날짜">1일</button></div></div><div class="repeat-ending"><span>종료</span><input id="repeat-ending" type="hidden" value=""><div class="repeat-toggle"><button type="button" id="repeat-never" aria-pressed="false" disabled>계속 반복</button><button type="button" id="repeat-end-date" aria-pressed="false" disabled>날짜 지정</button></div></div><input id="repeat-until" type="hidden"><button id="repeat-date-button" type="button" aria-label="반복 종료일 선택" hidden><span>날짜 선택</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4M17 3v4M3 10h18"/></svg></button><p class="repeat-note">이 항목만 반복돼요. 완료는 날짜마다 따로 기록해요.</p></div><label>메모<textarea id="memo" rows="1"></textarea></label><fieldset class="color-field"><legend>색상</legend><div id="color-picks"></div><input id="color" type="hidden" value="blue"></fieldset><label class="inline"><input type="checkbox" id="done"> 완료</label><p id="error" role="alert"></p><button class="save" type="submit">저장</button><button id="delete" class="delete" type="button">삭제</button></form></dialog>
<dialog id="group-editor"><form id="group-form" novalidate><div class="dialog-head"><h2 id="group-title">카테고리 추가</h2><button type="button" id="group-cancel" aria-label="닫기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><label>카테고리 이름<input id="group-name" autofocus required maxlength="30"></label><p id="group-error" class="field-error" role="alert"></p><fieldset class="color-field"><legend>색상</legend><div id="group-color-picks"></div><input id="group-color" type="hidden" value="blue"></fieldset><button class="save" id="group-save">추가</button><button type="button" class="delete" id="group-delete" hidden>삭제</button></form></dialog><dialog id="calendar-dialog"><div class="dialog-head"><h2>캘린더</h2><button id="calendar-close" aria-label="캘린더 닫기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><div class="calendar-nav"><button id="month-prev" aria-label="이전 달"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m15 5-7 7 7 7"/></svg></button><strong id="calendar-month"></strong><button id="month-next" aria-label="다음 달"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m9 5 7 7-7 7"/></svg></button></div><div class="calendar-week"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div><div id="calendar-days"></div></dialog><p id="status" role="status"></p><dialog id="color-spectrum" aria-labelledby="spectrum-title"><div class="dialog-head"><h2 id="spectrum-title">색상 선택</h2><button type="button" id="spectrum-cancel" aria-label="색상 선택 취소"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><div id="spectrum-square" aria-label="색상 스펙트럼"><i id="spectrum-cursor"></i></div><label class="spectrum-hue-label">색조<input id="spectrum-hue" type="range" min="0" max="359" value="0"></label><div class="spectrum-value"><span id="spectrum-preview"></span><label>색상 코드<input id="spectrum-hex" maxlength="7" value="#ffffff" spellcheck="false"></label></div><button type="button" class="save" id="spectrum-apply">적용</button></dialog><dialog id="month-day-dialog"><div class="dialog-head"><h2>반복 날짜</h2><button type="button" id="month-day-close" aria-label="반복 날짜 닫기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><div id="month-day-options"><button type="button" data-date="1">1</button><button type="button" data-date="2">2</button><button type="button" data-date="3">3</button><button type="button" data-date="4">4</button><button type="button" data-date="5">5</button><button type="button" data-date="6">6</button><button type="button" data-date="7">7</button><button type="button" data-date="8">8</button><button type="button" data-date="9">9</button><button type="button" data-date="10">10</button><button type="button" data-date="11">11</button><button type="button" data-date="12">12</button><button type="button" data-date="13">13</button><button type="button" data-date="14">14</button><button type="button" data-date="15">15</button><button type="button" data-date="16">16</button><button type="button" data-date="17">17</button><button type="button" data-date="18">18</button><button type="button" data-date="19">19</button><button type="button" data-date="20">20</button><button type="button" data-date="21">21</button><button type="button" data-date="22">22</button><button type="button" data-date="23">23</button><button type="button" data-date="24">24</button><button type="button" data-date="25">25</button><button type="button" data-date="26">26</button><button type="button" data-date="27">27</button><button type="button" data-date="28">28</button><button type="button" data-date="29">29</button><button type="button" data-date="30">30</button><button type="button" data-date="31">31</button></div></dialog><dialog id="cloud-dialog"><div class="dialog-head"><h2>계정 연결</h2><button id="cloud-close" type="button" aria-label="계정 연결 창 닫기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><p id="cloud-message"></p><button id="cloud-primary" class="save" type="button"></button><button id="cloud-secondary" type="button"></button><button id="cloud-backup" type="button" hidden>이 기기의 계정 기록 백업</button><button id="cloud-logout" type="button" hidden>로그아웃</button></dialog><dialog id="clock-dialog" aria-labelledby="clock-title"><div class="dialog-head"><h2 id="clock-title">시작시간</h2><button id="clock-close" type="button" aria-label="시간 선택 닫기">×</button></div><div class="clock-pair"><div class="clock-column"><span>시</span><div id="clock-hour" class="clock-list" role="group" aria-label="시 (24시간)"></div></div><span>:</span><div class="clock-column"><span>분</span><div id="clock-minute" class="clock-list" role="group" aria-label="분"></div></div></div><button id="clock-clear" type="button" hidden>시간 해제</button><button id="clock-apply" type="button" class="save">적용</button></dialog><script src="./app.js"></script><script type="module" src="./firebase-sync.js"></script></body></html>
